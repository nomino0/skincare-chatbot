# Model Training Parameters
# Used by DVC pipeline and training scripts

# Data Processing
img_size: 224
batch_size: 32
split_ratio: 0.2
random_seed: 42

# Model Training
epochs: 50
learning_rate: 0.001
dropout_rate: 0.3
early_stopping_patience: 10

# Transfer Learning
backbone: "MobileNetV2"
pretrained_weights: "imagenet"
freeze_layers: 100
fine_tune_lr_factor: 0.1

# Data Augmentation
augmentation:
  rotation_range: 20
  width_shift_range: 0.2
  height_shift_range: 0.2
  horizontal_flip: true
  zoom_range: 0.1

# Model Output
skin_types:
  - "Dry"
  - "Normal"
  - "Oily"

skin_problems:
  - "Acne"
  - "Dark_Spots"
  - "Wrinkles"
  - "Redness"
  - "Dark_Circles"
