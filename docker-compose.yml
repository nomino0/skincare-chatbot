version: '3.8'

services:
  # =============================================================
  # FRONTEND SERVICE - Next.js Application
  # =============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: skinpredict-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:5000
    depends_on:
      - api
    networks:
      - skinpredict-network
    restart: unless-stopped

  # =============================================================
  # API SERVICE - Flask Backend
  # =============================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: skinpredict-api
    ports:
      - "5000:5000"
    env_file:
      - ./api/.env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/skinpredict
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./api/uploads:/app/uploads
      - model-data:/app/models
    depends_on:
      - db
      - redis
    networks:
      - skinpredict-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================
  # REDIS SERVICE - Message Broker
  # =============================================================
  redis:
    image: redis:7-alpine
    container_name: skinpredict-redis
    ports:
      - "6379:6379"
    networks:
      - skinpredict-network
    restart: unless-stopped

  # =============================================================
  # WORKER SERVICE - Celery Background Tasks
  # =============================================================
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: skinpredict-worker
    command: celery -A app.celery_worker.celery worker --loglevel=info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/skinpredict
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    volumes:
      - ./api/uploads:/app/uploads
      - model-data:/app/models
    depends_on:
      - db
      - redis
    networks:
      - skinpredict-network
    restart: unless-stopped

  # =============================================================
  # DATABASE SERVICE - PostgreSQL
  # =============================================================
  db:
    image: postgres:15-alpine
    container_name: skinpredict-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=skinpredict
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - skinpredict-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================
  # MLFLOW SERVICE - Experiment Tracking
  # =============================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: skinpredict-mlflow
    ports:
      - "5001:5000"
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    networks:
      - skinpredict-network
    restart: unless-stopped

  # =============================================================
  # TRAINING SERVICE - Model Training Pipeline
  # =============================================================
  training:
    build:
      context: ./api
      dockerfile: Dockerfile.train
    container_name: skinpredict-training
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/skinpredict
    volumes:
      - ./api/data:/app/data
      - model-data:/app/models
      - training-logs:/app/logs
    depends_on:
      - mlflow
      - db
    networks:
      - skinpredict-network
    profiles:
      - training # Only run when explicitly requested

  # =============================================================
  # RETRAINING SERVICE - Active Learning Pipeline
  # =============================================================
  retraining:
    build:
      context: ./api
      dockerfile: Dockerfile.retrain
    container_name: skinpredict-retraining
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/skinpredict
      - EXPORT_ENDPOINT=http://api:5000/api/professional/export
    volumes:
      - ./api/data:/app/data
      - model-data:/app/models
      - training-logs:/app/logs
    depends_on:
      - api
      - mlflow
      - db
    networks:
      - skinpredict-network
    profiles:
      - retraining # Only run when explicitly requested

  # =============================================================
  # DATA DRIFT DETECTOR SERVICE
  # =============================================================
  drift-detector:
    build:
      context: ./api
      dockerfile: Dockerfile.drift
    container_name: skinpredict-drift
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/skinpredict
      - API_URL=http://api:5000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - CHECK_INTERVAL=3600 # Check every hour
    volumes:
      - drift-data:/app/drift
    depends_on:
      - api
      - db
    networks:
      - skinpredict-network
    profiles:
      - monitoring

  # =============================================================
  # NGINX REVERSE PROXY (Optional for Production)
  # =============================================================
  nginx:
    image: nginx:alpine
    container_name: skinpredict-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api
    networks:
      - skinpredict-network
    profiles:
      - production
    restart: unless-stopped

networks:
  skinpredict-network:
    driver: bridge

volumes:
  postgres-data:
  mlflow-data:
  model-data:
  training-logs:
  drift-data:
