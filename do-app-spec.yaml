# DigitalOcean App Platform Specification
# Deploy with: doctl apps create --spec do-app-spec.yaml

name: skinpredict
region: fra

services:
  # ===========================================
  # API Service (Flask Backend)
  # ===========================================
  - name: api
    image:
      registry_type: DOCR
      repository: skinpredict-api
      tag: latest
    instance_count: 1
    instance_size_slug: basic-xs
    http_port: 5000
    routes:
      - path: /api
      - path: /health
    envs:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET

      # External APIs
      - key: GROQ_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_MAPS_API_KEY
        scope: RUN_TIME
        type: SECRET
      # CORS - Allow the frontend to access the API
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: ${frontend.PUBLIC_URL}
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3

  # ===========================================
  # Frontend Service (Next.js)
  # ===========================================
  - name: frontend
    image:
      registry_type: DOCR
      repository: skinpredict-frontend
      tag: latest
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        value: ${api.PUBLIC_URL}
      - key: NODE_ENV
        value: production
    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10

# ===========================================
# Managed Databases & Services
# ===========================================
databases:
  # PostgreSQL
  - name: db
    engine: PG
    version: "15"
    production: false
    cluster_name: skinpredict-db-prod
    db_name: skinpredict
    db_user: skinpredict
    size: db-s-1vcpu-1gb
