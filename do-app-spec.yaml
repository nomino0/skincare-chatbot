# DigitalOcean App Platform Specification (Backend Only)
# Deploy with: doctl apps create --spec do-app-spec.yaml

name: skinpredict-api
region: fra  # Frankfurt (since your Spaces is in fra1)

services:
  # ===========================================
  # API Service (Flask Backend)
  # ===========================================
  - name: api
    image:
      registry_type: DOCR
      repository: skinpredict-api
      tag: latest
    instance_count: 1
    instance_size_slug: basic-xs  # 1GB RAM - good for ML model
    http_port: 5000
    routes:
      - path: /  # Serve API from root or /api depending on preference, but usually simpler to put at root for API-only apps
    envs:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: GROQ_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_MAPS_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      # Redis for async tasks
      - key: REDIS_URL
        scope: RUN_TIME
        value: redis://${redis.username}:${redis.password}@${redis.hostname}:${redis.port}
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3

# ===========================================
# Managed Database
# ===========================================
databases:
  - name: db
    engine: PG
    version: "15"
    production: false
    cluster_name: skinpredict-db
    db_name: skinpredict
    db_user: skinpredict
    size: db-s-1vcpu-1gb

# ===========================================
# Redis (for Celery)
# ===========================================
# Optional: Add Managed Redis if you want async tasks in production
# Remove if not needed to save cost (~$15/mo)
# services:
#   - name: redis
#     ...
